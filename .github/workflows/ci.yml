name: Build and test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vendor/eufy-security-client/package-lock.json
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - run: npm test
